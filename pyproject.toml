[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-channel-archive"
version = "1.1.0"
description = "A private, searchable local archive of Telegram channel posts and media"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
dependencies = ["Telethon>=1.42,<2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
channel-archive = "telegram_scraper.cli:main"

[tool.setuptools.packages.find]
include = ["telegram_scraper*"]

[tool.setuptools.package-data]
telegram_scraper = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
