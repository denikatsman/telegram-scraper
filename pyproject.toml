[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-scraper"
version = "1.3.1"
description = "Telegram Scraper: save and search Telegram messages, videos and files locally"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
dependencies = ["Telethon>=1.42,<2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
telegram-scraper = "telegram_scraper.cli:main"

[tool.setuptools.packages.find]
include = ["telegram_scraper*"]

[tool.setuptools.package-data]
telegram_scraper = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
